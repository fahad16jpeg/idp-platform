name: Terraform setup
description: >-
  Check the repository variables, log in to Azure with OIDC (no stored secrets),
  install Terraform and initialise the shared remote state.
  Reads ARM_* and TFSTATE_* from the calling job's environment.

runs:
  using: composite
  steps:
    - name: Check repository variables
      shell: bash
      run: |
        missing=0
        for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID \
                    TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT; do
          if [ -z "${!name}" ]; then
            echo "::error::${name} is empty. Run scripts/bootstrap-azure.sh and set the repository variables it prints (see README)."
            missing=1
          fi
        done
        exit "$missing"

    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        # The wrapper adds extra output that breaks `terraform output -raw`.
        terraform_wrapper: false

    - name: Terraform init
      shell: bash
      working-directory: terraform
      run: |
        terraform init -input=false \
          -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
          -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=${TFSTATE_KEY}" \
          -backend-config="use_azuread_auth=true" \
          -backend-config="use_oidc=true"
