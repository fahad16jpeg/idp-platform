# Push to main:  test + lint  ->  build + scan + push  ->  terraform plan + deploy + verify
name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits rather than cancelling a half-applied deploy.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
